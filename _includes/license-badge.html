{% if page.license %}
  {% assign license_author = page.author | default: site.author.name %}
  <p class="post__license">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4zm0 2.2 7 3.1v4.7c0 4-3 6.9-7 7.9-4-1-7-3.9-7-7.9V7.3l7-3.1z"/>
    </svg>
    <span>
      Publié par {{ license_author }} sous licence
      {% if page.license_url %}
        <a href="{{ page.license_url }}" target="_blank" rel="noopener license">{{ page.license }}</a>
      {% else %}
        {{ page.license }}
      {% endif %}.
    </span>
  </p>
{% endif %}
