---
layout: default
---
<article class="post wrap wrap--narrow">
  <header class="post__header">
    <p class="post__date">{{ page.date | date: "%d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
      <ul class="post__tags">
        {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </header>
  <div class="post__content">
    {{ content }}
  </div>
  <p class="post__back"><a href="{{ '/blog/' | relative_url }}">&larr; Retour au blog</a></p>
</article>
